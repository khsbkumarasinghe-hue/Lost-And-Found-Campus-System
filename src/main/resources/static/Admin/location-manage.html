<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Management - UOC Lost & Found</title>
    <link rel="stylesheet" href="../User/css/style.css">
</head>
<body>

<div class="app-layout">

    <div class="sidebar">
        <h2>UOC Lost & Found</h2>
        <a href="admin-claims.html">Claims</a>
        <a href="admin-feedback.html">Feedback / Reports</a>
        <a href="category-manage.html">Category Management</a>
        <a href="location-manage.html" class="active">Location Management</a>
        <a href="user-manage.html">User Management</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="app-main">

        <div class="page-header">
            <div>
                <h2>Location Management</h2>
                <p class="feedback-section-subtitle">Add, edit, or remove campus locations used when reporting items.</p>
            </div>
            <button class="btn-primary small-main-button" onclick="loadLocations()">Refresh</button>
        </div>

        <div class="claim-form-panel">
            <input type="hidden" id="locationId">
            <label>Location Name</label>
            <div style="display:flex; gap:10px; margin-top:6px;">
                <input type="text" id="locationName" placeholder="Example: Library" style="flex:1;">
                <button class="btn-primary small-main-button" onclick="addLocation()">Create</button>
                <button class="admin-update-button" style="border:none; border-radius:6px; padding:8px 16px; cursor:pointer; font-weight:600;" onclick="updateLocation()">Update</button>
                <button class="admin-delete-button" style="border:none; border-radius:6px; padding:8px 16px; cursor:pointer; font-weight:600;" onclick="clearForm()">Clear</button>
            </div>
        </div>

        <div class="admin-feedback-table-wrapper">
            <table class="admin-feedback-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Location Name</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="locationTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="js/location-manage.js"></script>
<script src="js/admin-guard.js"></script>

</body>
</html>

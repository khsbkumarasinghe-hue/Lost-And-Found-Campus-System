<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback / Report Abuse - Lost & Found</title>

    <link rel="stylesheet" href="../User/css/style.css">
</head>

<body>

<div class="app-layout">

    <div class="sidebar">
        <h2>UOC Lost & Found</h2>

        <a href="../User/profile.html">
            Dashboard
        </a>

        <a href="../Item/browse-items.html">
            Browse Items
        </a>

        <a href="../Item/report-item.html">
            Report Item
        </a>

        <a href="../Claim/claims.html">
            My Claims
        </a>

        <a href="feedback-report.html" class="active">
            Feedback / Report Abuse
        </a>

        <a href="../User/profile.html">
            Profile
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>
    </div>

    <!-- Main content -->
    <div class="app-main">

        <div class="report-container">

            <h2 id="formTitle">Feedback / Report Abuse</h2>

            <p class="subtitle">
                Send general feedback or report a suspicious item listing.
            </p>

            <!-- Used when editing -->
            <input type="hidden" id="feedbackId">

            <label for="userName">Your Name</label>

            <input
                    type="text"
                    id="userName"
                    placeholder="Enter your name">

            <label for="email">Email Address</label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address">

            <label for="reportType">Submission Type</label>

            <select id="reportType" onchange="changeReportType()">
                <option value="">Select submission type</option>
                <option value="FEEDBACK">General Feedback</option>
                <option value="REPORT_ABUSE">Report Abuse</option>
            </select>

            <!-- Displayed only for abuse reports -->
            <div id="itemIdContainer" style="display: none;">

                <label for="itemId">
                    Item ID
                    <span class="optional-text">(Optional)</span>
                </label>

                <input
                        type="number"
                        id="itemId"
                        placeholder="Enter the suspicious item ID">

            </div>

            <label for="subject">Subject</label>

            <input
                    type="text"
                    id="subject"
                    placeholder="Enter a short subject">

            <label for="message">Message</label>

            <textarea
                    id="message"
                    maxlength="1000"
                    placeholder="Describe your feedback or report..."></textarea>

            <div id="formMessage"></div>

            <div class="feedback-button-row">

                <button
                        type="button"
                        class="btn-primary"
                        id="submitButton"
                        onclick="saveFeedback()">

                    Submit Feedback
                </button>

                <button
                        type="button"
                        class="btn-secondary"
                        id="cancelButton"
                        onclick="cancelEdit()"
                        style="display: none;">

                    Cancel Edit
                </button>

            </div>

        </div>

        <!-- Optional user submissions section -->
        <div class="feedback-list-container">

            <div class="page-header">

                <div>
                    <h2>Submitted Feedback</h2>

                    <p class="feedback-section-subtitle">
                        View, edit or delete your submitted records.
                    </p>
                </div>

                <button
                        class="btn-primary small-main-button"
                        onclick="loadFeedbackReports()">

                    Refresh
                </button>

            </div>

            <div id="feedbackGrid" class="feedback-grid"></div>

            <p id="emptyFeedbackMessage" class="empty-feedback-message">
                Loading feedback records...
            </p>

        </div>

    </div>
</div>

<script src="js/feedback-report.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Browse Items - Lost & Found</title>
    <link rel="stylesheet" href="../User/css/style.css">
</head>
<body>

<div class="app-layout">
    <div class="sidebar">
        <h2>UOC Lost & Found</h2>
        <!--<a href="#">Dashboard</a>-->
        <a href="../Item/browse-items.html" class="active">Browse Items</a>
        <a href="../Item/report-item.html">Report Item</a>
        <a href="../Claim/claims.html">My Claims</a>
        <a href="../Feedback/feedback-report.html">Feedback / Report Abuse</a>
        <a href="../Notification/notifications.html">Notifications</a>
        <a href="../User/profile.html">Profile</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="app-main">
        <div class="page-header">
            <h2>Browse Lost & Found Items</h2>
            <a href="report-item.html"><button class="btn-primary" style="width:auto; padding:10px 18px;">+ Report Item</button></a>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search items..." oninput="loadItems()">
            <select id="statusFilter" onchange="loadItems()">
                <option value="">All Status</option>
                <option value="LOST">Lost</option>
                <option value="FOUND">Found</option>
            </select>
        </div>

        <div class="item-grid" id="itemGrid"></div>
    </div>
</div>

<script>
    const API_URL = '/api/items';

    let categoryMap = {};
    let locationMap = {};

    async function loadCategoryMap() {
        const categoryResponse = await fetch('/api/categories');
        const categories = await categoryResponse.json();

        // Step 2: build a simple lookup object, like a phone book: { 1: "Electronics", 2: "Wallets", ... }
        for (let i = 0; i < categories.length; i++) {
            const cat = categories[i];
            categoryMap[cat.id] = cat.name;
        }
    }

    async function loadLocationMap() {
        const locations = await (await fetch('/api/campus-locations')).json();
        for (let i = 0; i < locations.length; i++) {
            locationMap[locations[i].id] = locations[i].locationName;
        }
    }

    async function loadItems() {
        const response = await fetch(API_URL);
        let items = await response.json();

        const search = document.getElementById('searchInput').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;

        items = items.filter(item =>
            item.name.toLowerCase().includes(search) &&
            (statusFilter === '' || item.status === statusFilter)
        );

        const grid = document.getElementById('itemGrid');
        grid.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';

            const categoryName = categoryMap[item.categoryId] || 'Uncategorized';
            const locationName = locationMap[item.locationId] || 'Unknown location';

            card.innerHTML = `
                <span class="badge ${item.status}">${item.status}</span>
                <div class="item-body">
                <h4>${item.name}</h4>
                <p>${categoryName}</p>
                <p>${locationName}</p>
                <p>${item.date ?? ''}</p>
          <div class="actions">
            ${item.status === 'FOUND' ? `<button class="claim-btn" onclick="claimItem(${item.id})">Claim</button>` : ''}
            <button class="edit-btn" onclick="editItem(${item.id})">Edit</button>
            <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
          </div>
        </div>
      `;
            grid.appendChild(card);
        });
    }

    function editItem(id) {
        window.location.href = `report-item.html?id=${id}`;
    }

    function claimItem(id) {
        window.location.href = `../Claim/claims.html?itemId=${id}`;
    }

    async function deleteItem(id) {
        if (!confirm('Delete this item?')) return;
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadItems();
    }

    function logout() {
        localStorage.removeItem('loggedInUserId');
        window.location.href = '../User/login.html';
    }


    async function loadEverything() {
        await loadCategoryMap();
        await loadLocationMap();
        loadItems();
    }

    loadEverything();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Lost & Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-side">
        <h1>Welcome Back!</h1>
        <p>Login to your account</p>
    </div>

    <div class="auth-form">
        <div class="auth-card">
            <h2>Login</h2>
            <p class="subtitle">Enter your credentials to continue</p>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <p class="error-text" id="errorText"></p>

            <button class="btn-primary" onclick="login()">Login</button>

            <p class="switch-link">Don't have an account? <a href="register.html">Register here</a></p>
        </div>
    </div>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorText = document.getElementById('errorText');

        const response = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const user = await response.json();
            localStorage.setItem('loggedInUserId', user.id);
            localStorage.setItem('loggedInUserRole', user.role);
            window.location.href = user.role === 'ADMIN' ? '../Admin/admin-claims.html' : 'profile.html';
        } else {
            errorText.innerText = "Invalid email or password.";
            errorText.style.display = 'block';
        }
    }
</script>

</body>
</html>
